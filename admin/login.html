<!DOCTYPE html>

<html lang="tr">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sur Halı | Yönetici Girişi</title>

<link rel="stylesheet" href="./admin-login.css">
```

</head>

<body>

```
<div class="login-container">

    <div class="login-box">

        <h1>Sur Halı</h1>

        <p>Yönetici Paneli</p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    E-Posta
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Şifre
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                Giriş Yap
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="./admin.js"></script>
```

</body>

</html>
