<!DOCTYPE html>
<html lang="tr">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Halılar | Sur Halı İznik</title>

    <meta
        name="description"
        content="Sur Halı İznik halı koleksiyonu."
    >

    <link
        rel="stylesheet"
        href="css/site.css"
    >

</head>


<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="header-container">

            <a
                href="index.html"
                class="logo-link"
            >

                <img
                    src="assets/images/logo.jpeg"
                    alt="Sur Halı İznik"
                    class="site-logo"
                >

            </a>


            <nav class="main-nav">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    Ana Sayfa
                </a>

                <a
                    href="halilar.html"
                    class="nav-link active"
                >
                    Halılar
                </a>

                <a
                    href="index.html#kategoriler"
                    class="nav-link"
                >
                    Koleksiyonlar
                </a>

                <a
                    href="index.html#iletisim"
                    class="nav-link"
                >
                    İletişim
                </a>

            </nav>

        </div>

    </header>


    <!-- PAGE -->

    <main>

        <section class="catalog-header">

            <div class="section-heading">

                <span>
                    SUR HALI İZNİK
                </span>

                <h1 id="catalogTitle">
                    Halılar
                </h1>

                <p id="catalogDescription">
                    Koleksiyonumuzdaki ürünleri keşfedin.
                </p>

            </div>

        </section>


        <!-- CATEGORY FILTER -->

        <section class="catalog-section">

            <div
                id="categoryFilters"
                class="category-filters"
            >

                <button
                    type="button"
                    class="category-filter active"
                    data-category="Halılar"
                >
                    Halılar
                </button>

                <button
                    type="button"
                    class="category-filter"
                    data-category="Klasik Yolluklar"
                >
                    Klasik Yolluklar
                </button>

                <button
                    type="button"
                    class="category-filter"
                    data-category="Sisal"
                >
                    Sisal
                </button>

                <button
                    type="button"
                    class="category-filter"
                    data-category="Kaymaz"
                >
                    Kaymaz
                </button>

                <button
                    type="button"
                    class="category-filter"
                    data-category="Özel Kesim"
                >
                    Özel Kesim
                </button>

            </div>


            <!-- PRODUCT GRID -->

            <div
                id="catalogProducts"
                class="product-grid catalog-grid"
            >

                <div class="loading-state">
                    Ürünler yükleniyor...
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-container">

            <div>

                <strong>
                    Sur Halı İznik
                </strong>

                <p>
                    Halı ve yolluk seçenekleri.
                </p>

            </div>

            <div>

                <a href="index.html">
                    Ana Sayfa
                </a>

                <a href="halilar.html">
                    Halılar
                </a>

                <a href="index.html#iletisim">
                    İletişim
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            © 2026 Sur Halı İznik

        </div>

    </footer>


    <!-- SCRIPTS -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

  <script src="js/site.js?v=999"></script>

</body>
</html>
