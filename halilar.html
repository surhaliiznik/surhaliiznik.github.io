<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Halılar | Sur Halı İznik</title>

    <meta
        name="description"
        content="Sur Halı İznik halı koleksiyonlarını keşfedin."
    >

    <link
        rel="stylesheet"
        href="css/site.css"
    >

</head>


<body>


    <!-- ======================================================
         HEADER
         ====================================================== -->

    <header class="site-header">

        <div class="container header-inner">

            <a
                href="index.html"
                class="logo-link"
            >

                <img
                    src="assets/images/logo.jpeg"
                    alt="Sur Halı İznik"
                    class="site-logo"
                    data-site-logo
                >

            </a>


            <nav class="main-navigation">

                <a href="index.html">
                    Ana Sayfa
                </a>

                <a
                    href="halilar.html"
                    class="active"
                >
                    Halılar
                </a>

                <a href="index.html#iletisim">
                    İletişim
                </a>

            </nav>

        </div>

    </header>



    <!-- ======================================================
         KATALOG
         ====================================================== -->

    <main class="catalog-page">


        <section class="catalog-header">

            <div class="container">

                <h1 id="catalogTitle">
                    Halılar
                </h1>

                <p id="catalogDescription">
                    Koleksiyonumuzdaki ürünleri keşfedin.
                </p>

            </div>

        </section>



        <!-- ==================================================
             KATEGORİ FİLTRELERİ
             ================================================== -->

        <section class="catalog-filters-section">

            <div class="container">

                <div
                    class="category-filters"
                    role="tablist"
                    aria-label="Halı kategorileri"
                >


                    <button
                        type="button"
                        class="category-filter"
                        data-category="Halılar"
                    >
                        Halılar
                    </button>


                    <button
                        type="button"
                        class="category-filter"
                        data-category="Klasik Yolluklar"
                    >
                        Klasik Yolluklar
                    </button>


                    <button
                        type="button"
                        class="category-filter"
                        data-category="Sisal"
                    >
                        Sisal
                    </button>


                    <button
                        type="button"
                        class="category-filter"
                        data-category="Kaymaz"
                    >
                        Kaymaz
                    </button>


                    <button
                        type="button"
                        class="category-filter"
                        data-category="Özel Kesim"
                    >
                        Özel Kesim
                    </button>


                </div>

            </div>

        </section>



        <!-- ==================================================
             ÜRÜNLER
             ================================================== -->

        <section class="catalog-products-section">

            <div class="container">

                <div
                    id="catalogProducts"
                    class="products-grid"
                >

                    <div class="catalog-loading">

                        <p>
                            Ürünler yükleniyor...
                        </p>

                    </div>

                </div>

            </div>

        </section>


    </main>



    <!-- ======================================================
         FOOTER
         ====================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 Sur Halı İznik. Tüm hakları saklıdır.
            </p>

        </div>

    </footer>



    <!-- ======================================================
         SUPABASE CDN
         ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ======================================================
         TEK ANA JAVASCRIPT
         ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/site.js?v=2001"></script>

</body>

</html>
